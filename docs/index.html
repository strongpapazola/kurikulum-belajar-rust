<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦀 Belajar Rust Interaktif</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <a class="logo" href="#">
        🦀 Belajar Rust
        <span class="logo-badge">Interaktif</span>
      </a>
    </div>
    <div class="header-right">
      <div class="progress-bar-wrap">
        <span id="progress-text">0/0 lesson</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
      <button class="btn-reset" id="btn-reset-progress">Reset Progress</button>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR -->
    <sidebar>
      <div class="sidebar-search">
        <input type="text" id="sidebar-search" placeholder="🔍 Cari lesson...">
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Generated by JS -->
      </nav>
    </sidebar>

    <!-- MAIN -->
    <div class="main">

      <!-- TABS -->
      <div class="content-tabs">
        <button class="tab active" data-tab="materi">📖 Materi</button>
        <button class="tab" data-tab="exercise">✏️ Exercise</button>
        <span class="content-title" id="content-title">Pilih lesson dari sidebar</span>
      </div>

      <!-- PANEL MATERI -->
      <div class="panel-materi active">
        <div id="materi-content" class="materi-content">
          <div class="empty-state">
            <div class="big-icon">🦀</div>
            <h2>Selamat Datang!</h2>
            <p>Pilih lesson dari sidebar untuk mulai belajar Rust.<br>Setiap lesson punya materi + exercise interaktif.</p>
          </div>
        </div>
      </div>

      <!-- PANEL EXERCISE -->
      <div class="panel-exercise">
        <div class="exercise-layout">

          <!-- Exercise description -->
          <div class="exercise-desc" id="exercise-desc">
            <div class="empty-state" style="height:100%">
              <p style="color:var(--text-muted)">Pilih lesson untuk lihat exercise</p>
            </div>
          </div>

          <!-- Editor + output -->
          <div class="exercise-editor-wrap">
            <div class="editor-toolbar">
              <span class="editor-filename">main.rs</span>
              <div class="editor-toolbar-right">
                <button class="btn-reset-code" id="btn-reset-code">↺ Reset</button>
                <button class="btn-mark-done" id="btn-mark-done">✓ Selesai</button>
                <button class="btn-run" id="btn-run">▶ Jalankan</button>
              </div>
            </div>

            <!-- Monaco Editor -->
            <div id="editor-container"></div>

            <!-- Output -->
            <div class="output-panel">
              <div class="output-header">
                <span class="output-label">Output</span>
                <span class="output-status" id="output-status"></span>
                <span class="output-time" id="output-time"></span>
              </div>
              <div class="output-content" id="output-content">
                <span class="output-placeholder">// Output akan muncul di sini setelah kode dijalankan</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div><!-- /main -->
  </div><!-- /layout -->

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- Monaco Editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

  <!-- App scripts -->
  <script src="js/curriculum.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
